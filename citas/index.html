<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Citas DMF</title>
  
  <!-- PWA / App Standalone -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0EA5E9" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Citas DMF" />
  <link rel="apple-touch-icon" href="../logo-dental-mas-facil.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  
    <style>
      :root{
        --paper:#F9FAFB;
        --surface:#FFFFFF;
        --ink:#0F172A;
        --muted:#475569;
        --muted-2:#94A3B8;
        --line:#E2E8F0;
        --line-soft:#F1F5F9;
        --primary:#0EA5E9;
        --primary-dark:#0284C7;
        --primary-tint:#F0F9FF;
        --radius: 12px;
        --shadow: none;
      }
      *{box-sizing:border-box;}
      html,body{margin:0;padding:0;}
      body{
        background:var(--paper);
        color:var(--ink);
        font-family:'Inter',sans-serif;
        -webkit-font-smoothing:antialiased;
        min-height:100vh;
      }
      ::selection{background:var(--primary-tint);color:var(--primary-dark);}

      .wrap{max-width:1320px;margin:0 auto;padding:28px 32px 64px;}

      header.top{
        display:flex;align-items:center;justify-content:space-between;
        gap:20px;margin-bottom:26px;flex-wrap:wrap;
      }
      .brand{display:flex;align-items:center;gap:14px;}
      .brand-mark{
        height:46px;
        display:flex;align-items:center;justify-content:center;
        flex-shrink:0;
      }
      .brand-mark img{
        height:100%;
        width:auto;
        object-fit:contain;
      }
      .brand-text h1{
        font-family:'Inter',sans-serif;font-weight:600;font-size:20px;margin:0;line-height:1.15;
        letter-spacing:-0.4px;
      }
      .brand-text p{margin:2px 0 0;font-size:13px;color:var(--muted); cursor:pointer; display:inline-block; transition:color 0.15s ease;}
      .brand-text p:hover{color:var(--primary);}
      
      .header-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
      .conn-status{
        display:flex;align-items:center;gap:7px;background:transparent;border:1px solid var(--line);
        border-radius:6px;padding:8px 14px;font-size:12px;font-weight:500;color:var(--muted);
      }
      .conn-status .conn-dot{width:6px;height:6px;border-radius:50%;background:var(--muted-2);flex-shrink:0;}
      .conn-status.on .conn-dot{background:#10B981;}
      .conn-status.on{color:#059669;}
      .conn-status.off .conn-dot{background:#EF4444;}
      .conn-status.off{color:#DC2626;}

      .gear-btn{
        width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:transparent;
        display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted);
        transition:border-color .15s ease, color .15s ease;
        flex-shrink:0;
      }
      .gear-btn:hover{border-color:var(--primary);color:var(--primary);}
      .gear-btn svg{width:16px;height:16px;}

      .main-tabs { display:flex; gap:24px; margin-bottom:24px; border-bottom:1px solid var(--line); }
      .main-tab {
        padding:10px 0; font-size:14px; font-weight:500; color:var(--muted);
        cursor:pointer; border-bottom:2px solid transparent; transition:all 0.15s ease;
        user-select: none; margin-bottom:-1px;
      }
      .main-tab:hover { color:var(--ink); }
      .main-tab.active { color:var(--primary-dark); border-bottom-color:var(--primary); }

      .grid{display:grid;grid-template-columns:1fr 400px;gap:24px;align-items:start;}

      .panel{
        background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
        box-shadow:none;
      }
      .panel-head{
        padding:20px 24px 16px;border-bottom:1px solid var(--line-soft);
      }
      .panel-head .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.04em;color:var(--muted-2);font-weight:600;}
      .panel-head h2{font-family:'Inter',sans-serif;font-weight:600;font-size:16px;margin:4px 0 0; letter-spacing:-0.3px;}
      .panel-body{padding:20px 24px 24px;}

      /* form */
      .field{margin-bottom:16px;}
      .field label{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-bottom:6px;}
      .field input[type=text], .field input[type=date], .field input[type=number], .field select, .field textarea{
        width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
        font-family:'Inter',sans-serif;font-size:14px;color:var(--ink);background:transparent;
        outline:none;transition:border-color .15s ease; -webkit-appearance: none;
      }
      .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--primary);}
      .field input::placeholder, .field textarea::placeholder{color:var(--muted-2);}

      .chip-group{display:flex;flex-wrap:wrap;gap:8px;}
      .chip{
        flex: 1 1 auto;text-align:center;
        padding:8px 12px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-weight:500;
        color:var(--muted);cursor:pointer;background:transparent;user-select:none;
        transition:all .12s ease;
      }
      .chip:hover{border-color:var(--muted-2);}
      .chip.active{background:var(--primary-tint);border-color:var(--primary-tint);color:var(--primary-dark);}

    .chip-verde.active { background:#E4F5EC; border-color:#4CAF7A; color:#1A5C38; }
    .chip-amarillo.active { background:#FDF4E4; border-color:#E8A825; color:#7A4A00; }
    .chip-rojo.active { background:#FDECEA; border-color:#D95555; color:#7A1F1F; }

    .submit-btn{
      width:100%;padding:10px 14px;border:none;border-radius:6px;background:var(--primary);
      color:#fff;font-weight:600;font-size:14px;cursor:pointer;margin-top:4px;
      transition:background .15s ease, transform .1s ease;
      font-family:'Inter',sans-serif;
      min-height:44px;
    }
    .submit-btn:disabled{opacity:0.7;cursor:not-allowed;}
    .submit-btn:not(:disabled):hover{background:var(--primary-dark);}
    .submit-btn:not(:disabled):active{transform:scale(0.99);}

    .form-success{font-size:13px;color:#10B981;margin-top:12px;text-align:center;font-weight:500;}

    /* Messages Preview */
    .msg-preview {
      background:#F8FAFC;
      border-radius:8px;
      overflow:hidden;
      border:1px solid var(--line);
      margin-bottom:12px;
    }
    .msg-header {
      background:var(--surface);
      border-bottom:1px solid var(--line);
      padding:10px 14px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .msg-avatar {
      width:28px; height:28px; border-radius:6px; background:var(--primary);
      display:flex; align-items:center; justify-content:center;
      font-size:12px; color:#fff; font-weight:600; font-family:'Inter',sans-serif;
    }
    .msg-content { padding:14px 12px; }
    .msg-bubble {
      background:var(--surface); border-radius:6px; padding:10px 12px;
      max-width:100%; box-shadow:none; border:1px solid var(--line);
    }
    .msg-text { font-size:13px; line-height:1.6; color:var(--ink); font-family:'Inter',sans-serif; word-break:break-word; white-space:pre-wrap; }
    .msg-meta { text-align:right; font-size:10px; color:var(--muted); margin-top:6px; }

    /* Mis Citas List */
    .cita-card {
      background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:16px;
      margin-bottom:12px; box-shadow:none; display:flex; flex-direction:column; gap:12px;
    }
    .cita-card-head { display:flex; justify-content:space-between; align-items:flex-start; }
    .cita-card-title { font-family:'Inter',sans-serif; font-size:15px; font-weight:600; color:var(--ink); }
    .cita-card-meta { font-size:13px; color:var(--muted); margin-top:4px; display:flex; gap:12px; }
    
    .badge { padding:4px 10px; border-radius:4px; font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; display:inline-block; }
    .badge.pendiente { background:#FEF3C7; color:#B45309; }
    .badge.asistio { background:#D1FAE5; color:#065F46; }
    .badge.no-asistio { background:#FEE2E2; color:#991B1B; }

    .cita-actions { display:flex; gap:10px; margin-top:4px; }
    .cita-btn { flex:1; padding:8px; border-radius:6px; font-weight:500; font-size:13px; cursor:pointer; font-family:'Inter',sans-serif; border:none; transition:opacity .15s; }
    .cita-btn:hover { opacity:0.9; }
    .cita-btn-yes { background:#10B981; color:#fff; }
    .cita-btn-no { background:#EF4444; color:#fff; }

    .spinner { border: 2px solid rgba(0,0,0,0.1); width: 24px; height: 24px; border-radius: 50%; border-left-color: var(--primary); animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* MODAL */
    .modal-overlay{
      display:none;position:fixed;inset:0;background:rgba(15, 23, 42,0.4);z-index:100;
      align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px);
    }
    .modal-overlay.show{display:flex;}
    .modal-box{
      background:var(--surface);border-radius:12px;max-width:460px;width:100%;
      box-shadow:0 10px 40px -10px rgba(0,0,0,0.2);overflow:hidden; border:1px solid var(--line);
    }
    .modal-head{padding:20px 24px 16px;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
    .modal-head .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted-2);font-weight:600;}
    .modal-head h2{font-family:'Inter',sans-serif;font-weight:600;font-size:16px;margin:4px 0 0; letter-spacing:-0.3px;}
    .modal-close{border:none;background:none;color:var(--muted-2);font-size:16px;cursor:pointer;line-height:1;padding:4px;}
    .modal-close:hover{color:var(--ink);}
    .modal-body{padding:20px 24px 24px;}
    .btn-secondary{
      padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:transparent;
      color:var(--muted);font-weight:500;font-size:14px;cursor:pointer;font-family:'Inter',sans-serif;
    }
    .btn-secondary:hover{border-color:var(--primary);color:var(--primary);}
    .flex-row { display:flex; gap:10px; }
    .flex-1 { flex:1; }
    .grid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    @media (max-width:850px){
      .grid{grid-template-columns:1fr;}
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const SUCURSALES = ["Tijuana", "Mexicali - Obregón", "Mexicali - Villa Verde", "Ensenada"];
    const DURACIONES = ["15","20","30","45","60","90","120"];
    const TIPOS_CITA = ["Valoración","Inicio de tratamiento","Seguimiento","Urgencia"];
    const MOTIVOS    = ["Estético","Funcional","Dolor","Estético y funcional","Preventivo"];
    const DECISIONES = ["Explorando opciones","Lista para iniciar","Urgente, ya decidió"];
    const FUENTES    = ["Meta Ads","Publicidad externa"];
    const ESTADOS    = ["En valoración","Ya decidió","Urgente"];
    const PAQUETES   = ["Individual", "Dual", "Familiar", "Convenio"];
    const ASESORES   = ["Miguel", "Carlos", "Zoe", "Edgar"];

    const HORAS = (() => {
      const opts = [];
      for (let h = 7; h <= 21; h++) {
        for (const m of [0,15,30,45]) {
          const ampm = h >= 12 ? "pm" : "am";
          const h12  = h % 12 || 12;
          const mStr = String(m).padStart(2,"0");
          opts.push({ value: `${String(h).padStart(2,"0")}:${mStr}`, label: `${h12}:${mStr} ${ampm}` });
        }
      }
      return opts;
    })();

    const DIAS_L  = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    const MESES_L = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

    const fmtDate = s => {
      if (!s) return "—";
      const [y,m,d] = s.split("-").map(Number);
      const dt = new Date(y, m-1, d);
      return `${DIAS_L[dt.getDay()]} ${String(d).padStart(2,"0")} de ${MESES_L[m-1]}`;
    };
    const fmtTime = s => {
      if (!s) return "—";
      const [h,min] = s.split(":").map(Number);
      return `${h%12||12}:${String(min).padStart(2,"0")} ${h>=12?"pm":"am"}`;
    };

    const LEAD = {
      Verde:    { css:"chip-verde", emoji:"🟢" },
      Amarillo: { css:"chip-amarillo", emoji:"🟡" },
      Rojo:     { css:"chip-rojo", emoji:"🔴" },
    };

    const EMPTY = {
      doctor:"", sucursal:"", fecha:"", hora:"", duracion:"30",
      nombre:"", genero:"Masculino", edad:"", tipo_paciente:"Nuevo",
      tipo_cita:"Valoración", tratamiento:"", cotizacion:"", estado:"En valoración",
      motivo:"", decision:"", alergias:"", notas:"",
      fuente:"Meta Ads", lead:"Verde", asesor:"", paquete:"Individual",
    };

    function CitaApp() {
      const [f, setF]       = useState({ ...EMPTY });
      const [cp1, setCp1]   = useState(false);

      
      const [tab, setTab] = useState('agendar'); 
      
      const [scriptUrl, setScriptUrl] = useState(localStorage.getItem('dmf_script_url') || localStorage.getItem('dmf_apps_script_url') || '');
      const [showSettings, setShowSettings] = useState(false);
      
      const [myAsesor, setMyAsesor] = useState(localStorage.getItem('dmf_my_asesor') || '');
      const [showAsesorModal, setShowAsesorModal] = useState(!localStorage.getItem('dmf_my_asesor'));
      
      const [citas, setCitas] = useState([]);
      const [loadingCitas, setLoadingCitas] = useState(false);
      
      const [isSaving, setIsSaving] = useState(false);
      const [saveMsg, setSaveMsg] = useState('');
      
      const [confirmandoAsistencia, setConfirmandoAsistencia] = useState(null); 

      useEffect(() => {
        if(myAsesor) {
          setF(prev => ({ ...prev, asesor: myAsesor }));
        }
      }, [myAsesor]);

      useEffect(() => {
        if(tab === 'miscitas' && scriptUrl && myAsesor) {
          cargarCitas();
        }
      }, [tab]);

      const set   = k => e => setF(p => ({ ...p, [k]: e.target.value }));
      const tog   = (k,v)  => setF(p => ({ ...p, [k]: v }));
      const reset = ()     => { setF({ ...EMPTY, asesor: myAsesor }); setSaveMsg(''); };

      const saveSettings = (e) => {
        e.preventDefault();
        const url = document.getElementById('txtUrl').value.trim();
        setScriptUrl(url);
        localStorage.setItem('dmf_script_url', url);
        localStorage.setItem('dmf_apps_script_url', url); 
        setShowSettings(false);
      };
      
      const saveAsesor = (as) => {
        setMyAsesor(as);
        localStorage.setItem('dmf_my_asesor', as);
        setShowAsesorModal(false);
      };

      const cargarCitas = async () => {
        setLoadingCitas(true);
        try {
          const res = await fetch(`${scriptUrl}?tipo=citas&asesor=${encodeURIComponent(myAsesor)}`);
          const data = await res.json();
          setCitas(data.reverse()); 
        } catch(e) {
          console.error(e);
          alert("Error al cargar citas. Verifica la URL de Apps Script.");
        }
        setLoadingCitas(false);
      };

      const guardarCita = async () => {
        if(!scriptUrl) return alert("Falta configurar la URL de Apps Script en el engranaje.");
        if(!f.nombre || !f.sucursal || !f.fecha) return alert("Falta nombre, sucursal o fecha.");
        
        setIsSaving(true);
        setSaveMsg('');
        try {
          const payload = { accion: 'crearCita', ...f, id: Date.now().toString() };
          const res = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(payload) });
          const result = await res.json();
          if(result.status === 'ok') {
            setSaveMsg('¡Cita agendada correctamente!');
            setTimeout(() => reset(), 2000);
          } else {
            alert('Error: ' + result.message);
          }
        } catch(e) {
          alert("Error de conexión al guardar.");
        }
        setIsSaving(false);
      };

      const marcarEstado = async (id, estado, paquete = null) => {
        setLoadingCitas(true);
        try {
          const payload = { accion: 'marcarAsistencia', id, estado };
          if(paquete) payload.paquete = paquete;
          
          const res = await fetch(scriptUrl, { method: 'POST', body: JSON.stringify(payload) });
          const result = await res.json();
          if(result.status === 'ok') {
            await cargarCitas();
          } else {
            alert('Error: ' + result.message);
          }
        } catch(e) {
          alert("Error de conexión.");
        }
        setConfirmandoAsistencia(null);
        setLoadingCitas(false);
      };

      const renderMsgText = (text) => {
        return text.split("\n").map((line, i) => {
          if (!line) return <div key={i} style={{ height:"0.6em" }} />;
          const parts = line.split(/(\*[^*]+\*)/g);
          return <div key={i}>{parts.map((p,j) => p.startsWith("*") && p.endsWith("*") ? <strong key={j}>{p.slice(1,-1)}</strong> : <span key={j}>{p}</span>)}</div>;
        });
      };

      const msgGrupo = () => {
        const SEP  = "─".repeat(30);
        const fecha = f.fecha ? fmtDate(f.fecha) : "—";
        const hora  = f.hora  ? fmtTime(f.hora)  : "—";
        const tipo  = f.tipo_paciente === "Nuevo" ? "Paciente nuevo" : "Paciente recurrente";
        const costo = f.cotizacion ? `$${Number(f.cotizacion).toLocaleString("es-MX")}` : null;
        const l2    = [costo, f.estado, f.paquete ? `Paquete ${f.paquete}` : null].filter(Boolean).join(" · ");
        const sucursalFmt = f.sucursal ? f.sucursal.replace(" - ", " ") : "—";

        const rows  = [
          `*DENTAL MÁS FÁCIL — CITA AGENDADA*`,
          SEP,
          `*DR(A). ${f.doctor || "—"}*`,
          `*${sucursalFmt}· ${fecha}*`,
          `${hora} · ~${f.duracion} min`,
          "",
          "*PACIENTE*",
          f.nombre || "—",
          [f.genero, f.edad ? f.edad+" años" : null, tipo].filter(Boolean).join(" · "),
          "",
          "*CONSULTA*",
          `${f.tipo_cita}${f.tratamiento ? " — "+f.tratamiento : ""}`,
          l2 || null,
          "",
          "*PARA EL DOCTOR*",
          f.motivo   ? `Motivo: ${f.motivo}` : null,
          f.decision ? `Decisión: ${f.decision}` : null,
          `Alergias: ${f.alergias || "N/A"}`,
          f.notas ? "" : null,
          f.notas ? "*NOTAS*" : null,
          f.notas ? f.notas : null,
          "",
          `*ASESOR: ${f.asesor || "—"} · Paciente${LEAD[f.lead].emoji}*`,
        ];
        return rows.filter(r => r !== null).join("\n");
      };



      const copy = async (text, setDone) => {
        try { await navigator.clipboard.writeText(text); }
        catch {
          const t = document.createElement("textarea");
          t.value = text; document.body.appendChild(t);
          t.select(); document.execCommand("copy"); document.body.removeChild(t);
        }
        setDone(true); setTimeout(() => setDone(false), 2500);
      };

      return (
        <div className="wrap">
          
          <div className={`modal-overlay ${showAsesorModal ? 'show' : ''}`}>
            <div className="modal-box" style={{maxWidth:350}}>
              <div className="modal-head" style={{borderBottom:'none'}}>
                <div>
                  <div className="eyebrow">Bienvenido</div>
                  <h2>¿Quién eres?</h2>
                </div>
              </div>
              <div className="modal-body">
                <p style={{marginTop:0}}>Selecciona tu nombre de asesor para continuar.</p>
                <div style={{display:'flex', flexDirection:'column', gap:8}}>
                  {ASESORES.map(a => (
                    <button key={a} onClick={() => saveAsesor(a)} className="btn-secondary" style={{textAlign:'left'}}>{a}</button>
                  ))}
                </div>
              </div>
            </div>
          </div>

          <div className={`modal-overlay ${showSettings ? 'show' : ''}`}>
            <div className="modal-box">
              <div className="modal-head">
                <div>
                  <div className="eyebrow">Conexión</div>
                  <h2>URL de la Web App</h2>
                </div>
                <button className="modal-close" onClick={() => setShowSettings(false)}>✕</button>
              </div>
              <form className="modal-body" onSubmit={saveSettings}>
                <p>Pega aquí la URL que te dio Apps Script al implementar el proyecto como aplicación web.</p>
                <div className="field">
                  <input type="text" id="txtUrl" defaultValue={scriptUrl} placeholder="https://script.google.com/macros/s/.../exec" />
                </div>
                <div className="flex-row" style={{marginTop:16}}>
                  <button type="button" className="btn-secondary" onClick={() => { setScriptUrl(''); localStorage.removeItem('dmf_script_url'); setShowSettings(false); }}>Quitar</button>
                  <button type="submit" className="submit-btn" style={{marginTop:0}}>Guardar y conectar</button>
                </div>
              </form>
            </div>
          </div>

          <header className="top">
            <div className="brand">
              <div className="brand-mark"><img src="../logo-dental-mas-facil.png" alt="Dental Más Fácil" /></div>
              <div className="brand-text">
                <h1>Agendación de Citas</h1>
                <p onClick={() => setShowAsesorModal(true)}>Asesor: <strong>{myAsesor || 'Ninguno'}</strong> (cambiar)</p>
              </div>
            </div>
            <div className="header-actions">
              <div className={`conn-status ${scriptUrl ? 'on' : 'off'}`}>
                <span className="conn-dot"></span>
                <span>{scriptUrl ? 'Conectado' : 'Sin conectar'}</span>
              </div>
              <button className="gear-btn" onClick={() => setShowSettings(true)} title="Configurar conexión">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="3"></circle>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06-.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
              </button>
            </div>
          </header>

          <div className="main-tabs">
            <div className={`main-tab ${tab === 'agendar' ? 'active' : ''}`} onClick={() => setTab('agendar')}>Agendar Cita</div>
            <div className={`main-tab ${tab === 'miscitas' ? 'active' : ''}`} onClick={() => setTab('miscitas')}>Mis Citas</div>
          </div>

          {tab === 'agendar' && (
            <div className="grid">
              <div className="panel">
                <div className="panel-head">
                  <div className="eyebrow">Formulario</div>
                  <h2>Datos de la Cita</h2>
                </div>
                <div className="panel-body">
                  <div className="grid-2">
                    <div className="field">
                      <label>Doctor / Doctora</label>
                      <input type="text" value={f.doctor} onChange={set("doctor")} placeholder="Nombre del Dr(a)." />
                    </div>
                    <div className="field">
                      <label>Sucursal</label>
                      <select value={f.sucursal} onChange={set("sucursal")}>
                        <option value="">Seleccionar sucursal</option>
                        {SUCURSALES.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                  </div>
                  
                  <div className="grid-2" style={{gridTemplateColumns:'1fr 1fr 80px'}}>
                    <div className="field">
                      <label>Fecha</label>
                      <input type="date" value={f.fecha} onChange={set("fecha")} />
                    </div>
                    <div className="field">
                      <label>Hora</label>
                      <select value={f.hora} onChange={set("hora")}>
                        <option value="">Hora</option>
                        {HORAS.map(h => <option key={h.value} value={h.value}>{h.label}</option>)}
                      </select>
                    </div>
                    <div className="field">
                      <label>Min</label>
                      <select value={f.duracion} onChange={set("duracion")}>
                        {DURACIONES.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                  </div>

                  <hr style={{border:0, borderTop:'1px solid var(--line-soft)', margin:'8px 0 24px'}} />

                  <div className="field">
                    <label>Nombre del paciente</label>
                    <input type="text" value={f.nombre} onChange={set("nombre")} placeholder="Nombre y apellidos" />
                  </div>
                  
                  <div className="grid-2" style={{gridTemplateColumns:'1fr 80px'}}>
                    <div className="field">
                      <label>Género</label>
                      <div className="chip-group">
                        <div className={`chip ${f.genero==='Masculino'?'active':''}`} onClick={()=>tog("genero","Masculino")}>Masculino</div>
                        <div className={`chip ${f.genero==='Femenino'?'active':''}`} onClick={()=>tog("genero","Femenino")}>Femenino</div>
                      </div>
                    </div>
                    <div className="field">
                      <label>Edad</label>
                      <input type="number" value={f.edad} onChange={set("edad")} placeholder="30" />
                    </div>
                  </div>

                  <div className="field">
                    <label>Tipo de paciente</label>
                    <div className="chip-group">
                      <div className={`chip ${f.tipo_paciente==='Nuevo'?'active':''}`} onClick={()=>tog("tipo_paciente","Nuevo")}>Paciente Nuevo</div>
                      <div className={`chip ${f.tipo_paciente==='Recurrente'?'active':''}`} onClick={()=>tog("tipo_paciente","Recurrente")}>Recurrente</div>
                    </div>
                  </div>

                  <hr style={{border:0, borderTop:'1px solid var(--line-soft)', margin:'8px 0 24px'}} />

                  <div className="grid-2">
                    <div className="field">
                      <label>Tipo de consulta</label>
                      <select value={f.tipo_cita} onChange={set("tipo_cita")}>
                        {TIPOS_CITA.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                    <div className="field">
                      <label>Estado del paciente</label>
                      <select value={f.estado} onChange={set("estado")}>
                        {ESTADOS.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="grid-2" style={{gridTemplateColumns:'1fr 140px 120px'}}>
                    <div className="field">
                      <label>Tratamiento</label>
                      <input type="text" value={f.tratamiento} onChange={set("tratamiento")} placeholder="Ej. Extracción" />
                    </div>
                    <div className="field">
                      <label>Paquete</label>
                      <select value={f.paquete} onChange={set("paquete")}>
                        {PAQUETES.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                    <div className="field">
                      <label>Cotización $</label>
                      <input type="number" value={f.cotizacion} onChange={set("cotizacion")} placeholder="0" />
                    </div>
                  </div>

                  <div className="grid-2">
                    <div className="field">
                      <label>Motivo principal</label>
                      <select value={f.motivo} onChange={set("motivo")}>
                        <option value="">Seleccionar</option>
                        {MOTIVOS.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                    <div className="field">
                      <label>Decisión</label>
                      <select value={f.decision} onChange={set("decision")}>
                        <option value="">Seleccionar</option>
                        {DECISIONES.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                  </div>

                  <div className="field">
                    <label>Alergias / medicamentos</label>
                    <input type="text" value={f.alergias} onChange={set("alergias")} placeholder="Dejar vacío si no hay" />
                  </div>
                  <div className="field">
                    <label>Notas para el doctor</label>
                    <textarea value={f.notas} onChange={set("notas")} placeholder="Lo que platicó con el paciente..." rows="3"></textarea>
                  </div>

                  <hr style={{border:0, borderTop:'1px solid var(--line-soft)', margin:'8px 0 24px'}} />

                  <div className="grid-2">
                    <div className="field">
                      <label>Fuente del Lead</label>
                      <select value={f.fuente} onChange={set("fuente")}>
                        {FUENTES.map(x => <option key={x}>{x}</option>)}
                      </select>
                    </div>
                    <div className="field">
                      <label>Semáforo</label>
                      <div className="chip-group">
                        {Object.entries(LEAD).map(([val, info]) => (
                          <div key={val} className={`chip ${f.lead===val ? info.css+' active' : ''}`} onClick={()=>tog("lead",val)} style={{padding:'10px'}}>
                            {info.emoji} {val}
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>

                  <div style={{marginTop:12}}>
                    <button onClick={guardarCita} disabled={isSaving} className="submit-btn">
                      {isSaving ? "Guardando..." : "Guardar Cita"}
                    </button>
                    {saveMsg && <div className="form-success">{saveMsg}</div>}
                  </div>
                </div>
              </div>


              <div>
                <div className="panel" style={{border:'none', background:'transparent', boxShadow:'none'}}>
                  <div className="panel-head" style={{padding:'0 0 12px', borderBottom:'none'}}>
                    <div className="eyebrow" style={{color:'var(--muted)'}}>Previsualización</div>
                    <h2>Aviso Interno (Grupo)</h2>
                  </div>
                  <div className="msg-preview">
                    <div className="msg-header">
                      <div className="msg-avatar" style={{background:'#25D366'}}>D</div>
                      <div>
                        <div style={{color:'var(--ink)', fontWeight:600, fontSize:13}}>Citas Dental Más Fácil</div>
                        <div style={{color:'var(--muted)', fontSize:11}}>Asesores · Recepción · Doctores</div>
                      </div>
                    </div>
                    <div className="msg-content">
                      <div className="msg-bubble">
                        <div className="msg-text">{renderMsgText(msgGrupo())}</div>
                        <div className="msg-meta">{f.hora ? fmtTime(f.hora) : "—"} ✓✓</div>
                      </div>
                    </div>
                  </div>
                  <button className="btn-secondary" style={{width:'100%'}} onClick={() => copy(msgGrupo(), setCp1)}>
                    {cp1 ? "✓ Copiado" : "Copiar aviso para el grupo"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {tab === 'miscitas' && (
            <div style={{maxWidth:700, margin:'0 auto'}}>
              {loadingCitas ? (
                <div className="spinner"></div>
              ) : citas.length === 0 ? (
                <div style={{textAlign:'center', padding:40, color:'var(--muted-2)'}}>
                  <div style={{fontSize:40, marginBottom:10}}>🦷</div>
                  No tienes citas agendadas aún.
                </div>
              ) : (
                citas.map(c => {
                  const isPendiente = c.Estado === 'Pendiente';
                  const cssBadge = c.Estado === 'Pendiente' ? 'pendiente' : c.Estado === 'Asistió' ? 'asistio' : 'no-asistio';
                  
                  return (
                    <div key={c.ID} className="cita-card">
                      <div className="cita-card-head">
                        <div>
                          <div className="cita-card-title">{c.Paciente}</div>
                          <div className="cita-card-meta">
                            <span><strong>Sede:</strong> {c.Sucursal}</span>
                            <span><strong>Doctor:</strong> {c.Doctor}</span>
                          </div>
                          <div className="cita-card-meta" style={{color:'var(--ink)', fontWeight:500}}>
                            📅 {fmtDate(c.Fecha)} a las {fmtTime(c.Hora)}
                          </div>
                        </div>
                        <div className={`badge ${cssBadge}`}>{c.Estado}</div>
                      </div>

                      {isPendiente && confirmandoAsistencia !== c.ID && (
                        <div className="cita-actions">
                          <button className="cita-btn cita-btn-no" onClick={() => marcarEstado(c.ID, 'No asistió')}>No asistió</button>
                          <button className="cita-btn cita-btn-yes" onClick={() => setConfirmandoAsistencia(c.ID)}>Sí Asistió ✓</button>
                        </div>
                      )}

                      {isPendiente && confirmandoAsistencia === c.ID && (
                        <div style={{background:'var(--paper)', padding:16, borderRadius:8, marginTop:8, border:'1px solid var(--line-soft)'}}>
                          <div style={{fontSize:13, fontWeight:600, color:'var(--ink)', marginBottom:12}}>¿Qué tipo de paquete se le cobró?</div>
                          <div className="chip-group">
                            {PAQUETES.map(pq => (
                              <div key={pq} className="chip" onClick={() => marcarEstado(c.ID, 'Asistió', pq)} style={{flex:1, border:'1px solid var(--line)'}}>
                                {pq}
                              </div>
                            ))}
                          </div>
                          <div style={{textAlign:'center', marginTop:12}}>
                            <a href="#" onClick={(e) => { e.preventDefault(); setConfirmandoAsistencia(null); }} style={{fontSize:12, color:'var(--muted)'}}>Cancelar</a>
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<CitaApp />);
  </script>
</body>
</html>
